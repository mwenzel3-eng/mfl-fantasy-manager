name: Sunday injury check

on:
  schedule:
    # 9:00 AM America/Phoenix. After the weekend's news but before waivers
    # clear, so injury reactions can still be acted on cheaply.
    - cron: "0 9 * * 0"
      timezone: "America/Phoenix"
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to check (blank = current lineup week)"
        type: string
        default: ""
      dry_run:
        description: "Force a report-only run for this invocation"
        type: boolean
        default: true

concurrency:
  group: sunday-injury-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Injury check
        env:
          MFL_LEAGUE_ID: ${{ secrets.MFL_LEAGUE_ID }}
          MFL_YEAR: ${{ vars.MFL_YEAR }}
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || vars.MFL_DRY_RUN }}
          MFL_ENABLE_WRITES: ${{ vars.MFL_ENABLE_WRITES }}
          SMS_PROVIDER: ${{ vars.SMS_PROVIDER }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python -m mcp_server.cli injuries --week "${{ inputs.week }}"
          else
            python -m mcp_server.cli injuries
          fi

