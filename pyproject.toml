[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfl-fantasy-manager"
version = "0.1.0"
description = "Read-only-by-default MCP server and decision engine for MyFantasyLeague"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "anyio>=4.0"]

[project.scripts]
mfl-waivers = "jobs.wednesday_waivers:main"
mfl-lineup = "jobs.thursday_lineup:main"
mfl-injuries = "jobs.sunday_injury_check:main"

[tool.setuptools]
packages = ["mcp_server", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:mcp_server.*"]
